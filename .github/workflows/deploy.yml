name: Deploy a Vercel

on:
  push:
    branches: [master]
    # El PDF del catálogo lo sube el admin después de cada publicación y nada
    # de la web lo usa: no justifica reconstruirla. (El catálogo, los
    # ajustes, los pedidos y las fotos ya no pasan por master: van a la rama
    # "datos", que no dispara este workflow. Ver src/utils/datos.js.)
    paths-ignore:
      - docs/catalogo.pdf

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Vercel CLI
        run: npm install -g vercel

      - name: Deploy a producción
        run: vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
