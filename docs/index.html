<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo SARO</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .card {
      text-align: center;
      max-width: 380px;
      padding: 2rem;
    }
    .logo {
      width: 120px;
      margin: 0 auto 1.5rem;
      opacity: 0.85;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: rgba(255,255,255,0.45); font-size: 0.85rem; }
    .fallback {
      display: none;
      margin-top: 1.5rem;
    }
    .fallback a {
      display: inline-block;
      background: rgba(255,255,255,0.1);
      color: #fff;
      text-decoration: none;
      padding: 0.6rem 1.5rem;
      border-radius: 0.75rem;
      font-size: 0.85rem;
      font-weight: 600;
      transition: background 0.2s;
    }
    .fallback a:hover { background: rgba(255,255,255,0.2); }
  </style>
  <script>
    // Redirigir al PDF automáticamente
    var pdfUrl = 'catalogo.pdf';
    fetch(pdfUrl, { method: 'HEAD' })
      .then(function(r) {
        if (r.ok) {
          window.location.href = pdfUrl;
        } else {
          document.getElementById('loading').style.display = 'none';
          document.getElementById('fallback').style.display = 'block';
        }
      })
      .catch(function() {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('fallback').style.display = 'block';
      });
  </script>
</head>
<body>
  <div class="card">
    <div id="loading">
      <div class="spinner"></div>
      <p>Cargando catálogo…</p>
    </div>
    <div id="fallback" class="fallback">
      <p style="margin-bottom: 1rem;">El catálogo se está preparando.<br>Volvé a intentar en unos minutos.</p>
    </div>
  </div>
</body>
</html>
